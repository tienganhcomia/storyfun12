<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ms. Mia's English Class</title>
    <style>
        :root {
            --bg-color: #fdf5e6;
            --accent-color: #ff9a9e;
            --text-color: #4a4a4a;
            --highlight-color: #fff176;
            --button-bg: #ffffff;
            --active-button: #8ed1fc;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(#ffe4b5 10%, transparent 10%),
                linear-gradient(135deg, #fdf5e6 0%, #ffecd2 100%);
            background-size: 30px 30px, 100% 100%;
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border-right: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        #logo-container {
            position: sticky;
            top: 0;
            padding: 20px 10px;
            text-align: center;
            background: transparent;
        }

        #logo-container img {
            max-width: 160px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.05));
        }

        h2 {
            font-size: 1.2rem;
            color: #d4a373;
            text-align: center;
            margin: 5px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #button-list-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 0 15px 20px 15px;
            -webkit-overflow-scrolling: touch;
        }

        .story-btn {
            width: 100%;
            background: var(--button-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
            transition: all 0.2s ease;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .story-btn.active {
            background: var(--active-button);
            color: white;
            border-color: #0693e3;
        }

        /* Main Reading Area */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            overflow-y: auto;
            position: relative;
            z-index: 1;
        }

        .instruction {
            text-align: center;
            font-weight: bold;
            color: #b5835a;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        #reading-box {
            background: rgba(255, 255, 255, 0.92);
            flex: 1;
            border-radius: 35px;
            padding: 40px;
            box-shadow: var(--shadow);
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            line-height: 1.7;
            font-size: 2.1rem;
            overflow-y: auto;
            border: 6px solid rgba(255, 255, 255, 0.6);
        }

        .word {
            display: inline-block;
            cursor: pointer;
            padding: 0 4px;
            border-radius: 8px;
            transition: background 0.1s;
            user-select: none;
            -webkit-user-select: none;
        }

        .word.playing {
            background: var(--highlight-color) !important;
            transform: scale(1.1);
        }

        /* Mobile Layout Adjustments */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #sidebar {
                width: 100%;
                height: auto;
                max-height: 35vh;
                border-right: none;
                border-bottom: 2px solid white;
            }
            #logo-container { padding: 10px; }
            #logo-container img { max-width: 100px; }
            h2 { font-size: 0.95rem; margin: 0 0 5px 0; }
            #button-list-wrapper {
                display: flex;
                flex-direction: row;
                overflow-x: auto;
                padding: 10px;
                gap: 10px;
            }
            .story-btn {
                width: auto;
                white-space: nowrap;
                margin-bottom: 0;
                padding: 8px 12px;
            }
            #main-content { padding: 15px; }
            #reading-box { font-size: 1.5rem; padding: 20px; border-radius: 20px; }
            .instruction { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <nav id="sidebar">
        <div id="logo-container">
            <img src="logo.png" alt="Ms. Mia Logo">
        </div>
        <h2>Storyfun 1 & 2</h2>
        <div id="button-list-wrapper">
            <div id="button-list"></div>
        </div>
    </nav>

    <main id="main-content">
        <div class="instruction">💻 Click a word | 📱 Double-tap a word</div>

        const buttonList = document.getElementById('button-list');
        const readingBox = document.getElementById('reading-box');
        const synth = window.speechSynthesis;
        let preferredVoice = null;

        function setPreferredVoice() {
            const voices = synth.getVoices();
            preferredVoice = voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Samantha'))) || 
                             voices.find(v => v.lang === 'en-US') || 
                             voices[0];
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = setPreferredVoice;
        }

        function init() {
            stories.forEach((story, index) => {
                const btn = document.createElement('button');
                btn.className = 'story-btn';
                btn.innerText = story.title;
                btn.onclick = () => loadStory(index);
                buttonList.appendChild(btn);
            });
            loadStory(0);
            setPreferredVoice();
        }

        function loadStory(index) {
            const buttons = document.querySelectorAll('.story-btn');
            buttons.forEach((btn, i) => btn.classList.toggle('active', i === index));

            readingBox.innerHTML = '';
            const lines = stories[index].text.split('\n');

            lines.forEach(line => {
                if (line.trim() === "") {
                    readingBox.appendChild(document.createElement('br'));
                    return;
                }
                const lineDiv = document.createElement('div');
                const parts = line.split(/(\s+)/); 

                parts.forEach(part => {
                    if (part.trim() === "") {
                        lineDiv.appendChild(document.createTextNode(part));
                    } else {
                        const span = document.createElement('span');
                        span.className = 'word';
                        span.innerText = part;

                        // Logic to handle PC vs Mobile
                        let lastTap = 0;
                        span.addEventListener('touchend', function(e) {
                            const currentTime = new Date().getTime();
                            const tapLength = currentTime - lastTap;
                            if (tapLength < 300 && tapLength > 0) {
                                // Double tap detected
                                speak(part, span);
                                e.preventDefault();
                            }
                            lastTap = currentTime;
                        });

                        span.addEventListener('click', function(e) {
                            // Only trigger on click if it's NOT a touch device
                            if (e.pointerType !== 'touch') {
                                speak(part, span);
                            }
                        });

                        lineDiv.appendChild(span);
                    }
                });
                readingBox.appendChild(lineDiv);
            });
            readingBox.scrollTop = 0;
        }

        function speak(word, element) {
            document.querySelectorAll('.word.playing').forEach(el => el.classList.remove('playing'));
            synth.cancel();

            const cleanWord = word.replace(/[.,!?;:“”]/g, "");
            const utterance = new SpeechSynthesisUtterance(cleanWord);

            utterance.rate = 0.65; 
            utterance.pitch = 1.1;

            if (preferredVoice) {
                utterance.voice = preferredVoice;
            } else {
                utterance.lang = 'en-US';
            }

            utterance.onstart = () => element.classList.add('playing');
            utterance.onend = () => element.classList.remove('playing');

            synth.speak(utterance);
        }

        init();
    </script>
</body>
</html>
